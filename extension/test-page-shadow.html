<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba Shadow DOM</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; line-height: 1.6; }
    #host { border: 1px solid #ccc; padding: 16px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Banner de cookies (simulado con Shadow DOM)</h1>
  <p>
    Este párrafo está en el documento normal, fuera de cualquier Shadow DOM.
    No debería verse afectado por este test en particular.
  </p>

  <div id="host"></div>

  <script>
    // Simulamos lo que hacen muchos banners reales (OneTrust, Cookiebot, etc.):
    // meten su contenido dentro de un Shadow DOM para aislar sus estilos.
    const host = document.getElementById('host');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = `
      <p>
        Al continuar navegando, aceptás que podemos compartir con terceros
        tu información, y usar reconocimiento facial para verificar tu identidad.
      </p>
      <button>Aceptar todo</button>
    `;
  </script>
</body>
</html>
